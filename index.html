:root{--bg:#0e1424;--card:#171f36;--line:#262f50;--ink:#fff;--mute:#9aa3ba;--grey:#7b7b7b;--hi:#ffd84d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.loading .wrap{visibility:hidden}
h1,h2,h3,h4{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:490px;margin:0 auto;padding-bottom:90px;overflow:hidden}
.cover{position:relative;height:190px;background:#1b2547 center/cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,var(--bg) 100%)}
.idrow{position:relative;display:flex;align-items:flex-end;gap:12px;padding:0 20px;margin-top:-56px}
.avatar{width:clamp(72px,22vw,92px);height:clamp(72px,22vw,92px);flex:none;border-radius:50%;background:#ff1107;color:#fff;display:grid;place-items:center;font-weight:800;font-size:38px;overflow:hidden;user-select:none;border:4px solid var(--bg)}
.avatar img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0;padding-bottom:6px}
h1{display:flex;align-items:center;gap:8px;font-size:clamp(28px,8.5vw,38px);line-height:1;font-weight:800}
.vf{width:.6em;height:.6em;flex:none;border-radius:50%;background:#fff;color:var(--bg);display:grid;place-items:center}
.vf svg{width:70%;height:70%}
.who p{margin:4px 0 0;color:#e6e9f5;font-size:13px}
.chat{display:inline-flex;align-items:center;gap:6px;background:var(--hi);color:#14213d;font-weight:700;font-size:14px;border-radius:99px;padding:5px 14px 5px 6px;flex:none;margin-bottom:8px}
.sg{font-family:"SocialMediaCircled";font-style:normal;font-weight:400;line-height:1;display:block}
.chat .sg{font-size:26px;color:#0e1424}
.in{padding:0 20px}
.hero{margin-top:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{position:relative;border-radius:20px;padding:14px 16px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.tile b{font-weight:800;font-size:18px}
.tile small{font-size:12.5px;line-height:1.3;opacity:.95}
.ti{width:42px;height:42px;color:#fff;flex:none;margin-bottom:auto}
.ti svg,.ti .sg{width:42px;height:42px;font-size:42px;display:block}
.ar{position:absolute;right:14px;top:12px;width:20px;height:20px;color:#fff}
.ar svg{width:100%;height:100%;display:block}
.socials{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center}
.so{display:block;width:46px;height:46px;color:#fff;flex:none}
.so svg,.so .sg{width:46px;height:46px;font-size:46px;display:block}
.so.pill{flex:1 1 150px;width:auto;height:46px;background:#fff;border-radius:99px;display:flex;align-items:center;justify-content:center;min-width:150px}
.so.pill svg{width:auto;height:24px}
.banners{columns:2;column-gap:12px;margin-top:22px}
.bn{display:block;break-inside:avoid;margin-bottom:12px;overflow:hidden;border-radius:18px;background:#10172c}
.bn img{display:block;width:100%;height:auto}
h2{font-size:21px;font-weight:800;letter-spacing:.01em;margin-top:40px}
.ss{margin:2px 0 14px;color:#e6e9f5;font-size:13px;max-width:60ch}
.car{scroll-padding:0 20px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px 6px;scrollbar-width:none;cursor:grab}
.car::-webkit-scrollbar{display:none}
.car.drag{cursor:grabbing;user-select:none}
.car>*{flex:0 0 auto;scroll-snap-align:start}
.vid{--vh:clamp(170px,50vw,240px);position:relative;width:min(calc(var(--vh) * var(--rt,1.7778) * var(--k,1)),86vw);aspect-ratio:var(--rt,1.7778);border-radius:18px;background:#10172c center/cover;overflow:hidden;border:0;padding:0;display:block}
.vid video{display:block;width:100%;height:100%;object-fit:contain}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .pl{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.75))}
.vid .pl i{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#14213d;font-style:normal;font-size:20px;padding-left:4px}
.vid .vt{position:absolute;left:14px;bottom:10px;right:14px;font-weight:700;font-size:13px;text-align:left}
.case{width:236px;height:170px;border-radius:18px;background:#1b2547 center/cover;position:relative;overflow:hidden;display:flex;align-items:flex-end;border:0;padding:0;text-align:left}
.case::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(0,0,0,.82))}
.case span{position:relative;padding:12px 14px;font-weight:700;font-size:13px}
.case em{position:absolute;top:10px;left:10px;font-style:normal;font-size:10px;font-weight:700;color:var(--hi);background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px}
.pcard{width:268px;background:var(--card);border-radius:20px;overflow:hidden}
.thumb{position:relative;height:170px;display:grid;place-items:center;font-weight:800;font-size:44px;color:#14213d;background-size:cover;background-position:center}
.thumb.fade::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,var(--card) 100%)}
.thumb .ar{z-index:1;top:14px;right:14px}
.thumb .tg{position:absolute;z-index:1;left:12px;top:12px;font-size:10px;font-weight:800;background:rgba(0,0,0,.6);color:var(--hi);padding:2px 8px;border-radius:6px}
.pb{position:relative;padding:0 16px 16px;margin-top:-34px}
.thumb:not(.fade)+.pb{margin-top:14px}
.pb h3{font-size:17px;font-weight:800}
.pb p{margin:2px 0 12px;color:#e6e9f5;font-size:12.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:700;font-size:15px}
.price s{display:block;color:var(--grey);font-weight:400;font-size:11px}
.buy{background:var(--hi);color:#14213d;border:0;border-radius:99px;padding:9px 24px;font-weight:700}
.tcard{width:280px;background:var(--card);border-radius:20px;padding:16px}
.th{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.tp{width:42px;height:42px;border-radius:50%;background:#e9e9ee center/cover;display:grid;place-items:center;font-weight:700;color:#8a8a95;flex:none}
.th b{display:block;line-height:1.2}.th small{color:var(--grey);font-size:10px}
.st{color:#ffd84d;letter-spacing:2px;font-size:13px;margin-left:auto}
.tcard p{margin:0;color:#e6e9f5;font-size:13px}
.faqs{display:grid;gap:10px;padding:0 20px}
details{background:var(--card);border-radius:16px;overflow:hidden}
summary{list-style:none;padding:16px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .ar{position:static;flex:none;width:22px;height:22px}
details p{margin:0;padding:16px 18px;background:#070c1a;color:#e6e9f5;font-size:13.5px}
footer{margin:40px 20px 0;color:var(--grey);font-size:14px}
@media(min-width:900px){
 .wrap{max-width:980px}
 .cover{height:260px}
 .avatar{width:112px;height:112px;font-size:46px}
 h1{font-size:44px}.who p{font-size:16px}
 .chat{font-size:16px;padding:6px 18px 6px 8px}.chat .sg{font-size:30px}
 .hero{display:grid;grid-template-columns:1fr 168px;gap:20px;align-items:stretch}
 .socials{margin-top:0;align-content:space-between}
 .tiles{grid-auto-rows:1fr}
 .tile{min-height:0}
 .tile b{font-size:20px}
 .banners{columns:3}

  for (let i = days - 1; i >= 0; i--) { const k = new Date(Date.now() + 7*36e5 - i*864e5).toISOString().slice(0,10); arr.push({d:k, ...(map[k] || {views:0, clicks:0, buys:0})}); }
  const mx = Math.max(1, ...arr.map(a => Math.max(a.views, a.clicks))), W = 600, Hh = 130, bw = W / arr.length;
  const bars = arr.map((a,i) => `<rect x="${(i*bw+bw*.15).toFixed(1)}" y="${(Hh - a.views/mx*Hh).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${(a.views/mx*Hh).toFixed(1)}" rx="2" fill="#ffd84d"><title>${a.d}: ${a.views} kunjungan, ${a.clicks} klik</title></rect>`).join("");
  const line = arr.map((a,i) => `${(i*bw+bw/2).toFixed(1)},${(Hh - a.clicks/mx*Hh).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} 156" width="100%" role="img" aria-label="Grafik kunjungan dan klik harian"><g>${bars}</g><polyline points="${line}" fill="none" stroke="#6b83ff" stroke-width="2.5" stroke-linejoin="round"/><text x="0" y="150" fill="#9aa3ba" font-size="11">${arr[0].d.slice(5)}</text><text x="${W}" y="150" fill="#9aa3ba" font-size="11" text-anchor="end">${arr[arr.length-1].d.slice(5)}</text><text x="${W}" y="10" fill="#9aa3ba" font-size="11" text-anchor="end">maks ${mx}</text></svg>`;
}
const bars = (rows, lab) => { const mx = Math.max(1, ...rows.map(r => r.n)); return rows.length ? rows.map(r => `<div class="bar"><span>${lab(r)}</span><b>${r.n}</b><i><s style="width:${(r.n/mx*100).toFixed(0)}%"></s></i></div>`).join("") : `<div class="note">Belum ada data.</div>`; };
function statsHtml(s, recent){
  const ctr = s.views ? (s.clicks / s.views).toFixed(1) + "×" : "–";
  const tl = {click:"klik", buy:"beli", pay:"bayar"};
  return `<div class="per">${[7,30,90].map(d => `<button type="button" data-days="${d}" aria-pressed="${d===days}">${d} hari</button>`).join("")}</div>
  <div class="kpis"><div class="kpi"><small>Kunjungan</small><b>${s.views}</b></div><div class="kpi"><small>Pengunjung unik</small><b>${s.visitors}</b></div><div class="kpi"><small>Klik link</small><b>${s.clicks}</b></div><div class="kpi"><small>Klik "Beli"</small><b>${s.buys}</b></div><div class="kpi"><small>Konfirmasi bayar</small><b>${s.pays}</b></div><div class="kpi"><small>Klik per kunjungan</small><b>${ctr}</b></div></div>
  <div class="panel"><h5>Per hari <span style="color:#ffd84d">■ kunjungan</span> <span style="color:#6b83ff">— klik</span></h5>${chartSvg(s.daily || [])}</div>
  <div class="panel"><h5>Paling banyak diklik</h5>${bars(s.top || [], r => `<span class="pill2">${tl[r.type] || r.type}</span>${esc(r.label)}`)}</div>
  <div class="panel"><h5>Lokasi audiens</h5><div class="per" id="mapmode"><button type="button" data-map="views" aria-pressed="true">Kunjungan</button><button type="button" data-map="clicks" aria-pressed="false">Klik</button></div><div id="geobox"></div><div id="maplist"></div></div>
  <div class="two"><div class="panel"><h5>Perangkat</h5>${bars(s.devices || [], r => esc(r.k))}</div><div class="panel"><h5>Sumber kunjungan</h5>${bars(s.refs || [], r => esc(r.k))}</div></div>
  <div class="panel"><h5>Aktivitas terbaru</h5>${recent.length ? recent.map(r => `<div class="rec"><span style="color:#9aa3ba">${relT(r.created_at)}</span><span>${tl[r.type] || (r.type === "view" ? "lihat" : r.type)}</span><span>${esc(r.label || "Halaman utama")}</span><span style="color:#9aa3ba">${esc([r.city, r.device].filter(Boolean).join(" · "))}</span></div>`).join("") : `<div class="note">Belum ada aktivitas.</div>`}</div>
  <div class="note">Kunjungan lu sendiri (saat login admin) tidak dihitung. Tidak menyimpan alamat IP.</div>`;
}
async function loadStats(){
  const t = await token(); if (!t) { showLogin(); return; }
  const box = $("edbody"); box.innerHTML = '<div class="note">Memuat data…</div>';
  try {
    const r = await fetch(SB_URL + "/rest/v1/rpc/site_stats", {method:"POST", headers:H(t), body:JSON.stringify({days})});
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    const rr = await fetch(SB_URL + "/rest/v1/events?select=created_at,type,label,device,city&order=created_at.desc&limit=15", {headers:H(t)});
    box.innerHTML = statsHtml(s, rr.ok ? await rr.json() : []); initGeo(s.geo || []);
  } catch(e){ box.innerHTML = `<div class="note">Statistik belum bisa dimuat (kode ${esc(e.message)}). Jalankan file <b>supabase-analytics.sql</b> di Supabase → SQL Editor dulu, lalu buka tab ini lagi.</div>`; }
}
function showLogin(){ $("login").style.display = "block"; $("edmain").style.display = "none"; $("side").innerHTML = ""; $("ed").classList.add("on"); }
async function openEd(){
  $("ed").classList.add("on"); document.body.classList.add("editing");
  if (await token()) { $("login").style.display = "none"; $("edmain").style.display = "block"; edRender(); } else showLogin();
}
function closeEd(){ $("ed").classList.remove("on"); }
$("fab").onclick = openEd;
$("lc").onclick = closeEd;
$("side").addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; edRender(); return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "goview") closeEd();
  if (b.id === "lo") { sess = null; try { localStorage.removeItem(KEY); } catch(x){} closeEd(); document.body.classList.remove("editing"); }
  if (b.id === "rs" && confirm("Kembalikan semua isi ke versi awal file ini? Data online ikut tertimpa.")) { S = adopt(JSON.parse($("data").textContent)); render(); edRender(); save(); }
});
$("edbody").addEventListener("input", e => {
  const t = e.target; if (!t.dataset.p) return;
  setP(t.dataset.p, t.dataset.c !== undefined ? t.checked : t.dataset.n !== undefined ? Number(t.value)||0 : t.value); save(); render();
});
$("edbody").addEventListener("click", e => {
  const mm = e.target.closest("[data-map]"); if (mm) { geoMode = mm.dataset.map; document.querySelectorAll("#mapmode button").forEach(x => x.setAttribute("aria-pressed", x.dataset.map === geoMode)); drawGeo(); return; }
  const d = e.target.closest("[data-days]"); if (d) { days = Number(d.dataset.days); loadStats(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const { act, k } = b.dataset, i = Number(b.dataset.i);
  if (/^auto/.test(act)) { autoFill(act, i); return; }
  if (act === "useimg") { useImg(b.dataset.p, Number(b.dataset.max) || 800); return; }
  if (act === "add") S[k].push(k === "products" ? {id:"p"+Date.now(),slug:"produk-"+Date.now().toString(36),gallery:[],about:"",features:"",benefits:"",meta:"",varLabel:"",variants:"",long:"",reviews:"",name:"Produk baru",desc:"Deskripsi singkat produk.",price:50000,was:0,color:"#c9d3ff",icon:"NEW",img:"",tag:"",payUrl:""} : {...L[k].blank});
  if (act === "del" && confirm("Hapus item ini?")) S[k].splice(i,1);
  if (act === "up" && i > 0) S[k].splice(i-1,0,S[k].splice(i,1)[0]);
  if (act === "down" && i < S[k].length-1) S[k].splice(i+1,0,S[k].splice(i,1)[0]);
  if (act === "clr") setP(b.dataset.p, "");
  if (act === "galdel") getP(b.dataset.p).splice(i, 1);
  save(); render(); edRender();
});
$("edbody").addEventListener("change", async e => {
  const f = e.target;
  if (f.dataset.gal && f.files.length) {
    const arr = getP(f.dataset.gal) || (setP(f.dataset.gal, []), getP(f.dataset.gal));
    for (const file of f.files) arr.push(await new Promise(res => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, Number(f.dataset.max) / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width*s); c.height = Math.round(im.height*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.8)); }; im.src = r.result; }; r.readAsDataURL(file); }));
    save(); render(); edRender(); return;
  }
  if (!f.dataset.img || !f.files[0]) return;

  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(1, Number(f.dataset.max) / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    setP(f.dataset.img, /favicon$/.test(f.dataset.img) ? c.toDataURL("image/png") : c.toDataURL("image/jpeg",.82)); save(); render(); edRender();
  }; im.src = r.result; };
  r.readAsDataURL(f.files[0]);
});
$("lg").onclick = async () => {
  if (!configured) { $("lerr").textContent = "Isi SB_URL dan SB_KEY di file index.html dulu."; return; }
  $("lerr").textContent = "Masuk…";
  try { await login($("le").value.trim(), $("lp").value); $("lp").value = ""; $("lerr").textContent = ""; openEd(); } catch(e){ $("lerr").textContent = e.message; }
};
$("edbody").addEventListener("mousemove", mapTip); $("edbody").addEventListener("click", mapTip);
let taps = [];
$("avatar").addEventListener("click", () => { const n = Date.now(); taps = taps.filter(t => n - t < 700).concat(n); if (taps.length >= 3) { taps = []; openEd(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeEd(); } });
